spring:
    jpa:
        hibernate.ddl-auto: create-drop
        open-in-view: false
        properties.hibernate:
            jdbc.time_zone: UTC
            id.db_structure_naming_strategy: single
        show-sql: true
        datasource:
            url: "jdbc:h2:mem:jpa_jbd"
            driverClassName: org.h2.Driver
            username: any       
            password: any
logging:
    file:
        name: /proseo/log/proseo-datatake-mgr.log
    level:
        root: INFO
        de.dlr.proseo: TRACE
        org.hibernate.engine.jdbc.env.internal: WARN
proseo:
    dtmgr:
        # A list of spacecraft codes to process datatakes for
        spacecrafts: [ S1A, S1C ]
        
        # Interval between datatake checks in milliseconds (default every hour; 0 disables processing of incomplete datatakes)
        #check.interval: 3600000
        
        # Timeout for incomplete datatakes in seconds (default 200 min, roughly corresponding to two orbits in LEO)
        #timeout: 12000
