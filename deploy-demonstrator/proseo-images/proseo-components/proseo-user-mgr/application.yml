spring:
    maxResults: 10000
    jpa:
        hibernate.ddl-auto: update
        open-in-view: false
        properties.hibernate:
            jdbc.time_zone: UTC
            #id.db_structure_naming_strategy: standard
    datasource:
        url: jdbc:postgresql://proseo-db:5432/proseo
        username: postgres
        password: demo-only
management:
    endpoints.web.exposure.include: "health"
logging:
    file: 
        name: /proseo/log/proseo-user-mgr.log
    level:
        root: INFO
        de.dlr.proseo: TRACE
        org.hibernate.engine.jdbc.env.internal: WARN
proseo:
    defaultuser.name: sysadm
    defaultuser.password: demo-only
    # Password expiration period in days
    password.expirationtime: 90
