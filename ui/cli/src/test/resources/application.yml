spring:
    main:
        web-application-type: NONE
logging:
    level:
        root: INFO
        org.apache.http: INFO
        de.dlr.proseo: TRACE
    file:
        name: proseo-ui-cli.log
proseo:
    instance:
        # instance identifier
        id: local
        # instance environment is one of dev (development), val (evaluation) or ops (operational)
        environment: dev
        # instance environment color for environment setting (background color of left-top and footer), see https://en.wikipedia.org/wiki/Web_colors
        # ops - rgb(0,0,0,.25) - standard
        # dev - BurlyWood
        # val - SkyBlue
        environmentColor: rgb(0,0,0,.25)
    cli:
        syntaxfile: ui-cli-syntax.yml
    
    # Configuration for local deployment
    userManager:
        url: http://localhost:8086/proseo/user-mgr/v0.1
    ingestor:
        url: http://localhost:8081/proseo/ingestor/v0.1
    orderManager:
        url: http://localhost:8082/proseo/order-mgr/v0.1
    productionPlanner:
        url: http://localhost:8083/proseo/planner/v0.1
    processorManager:
        url: http://localhost:8084/proseo/processor-mgr/v0.1
    productClassManager:
        url: http://localhost:8085/proseo/productclass-mgr/v0.1
    facilityManager:
        url: http://localhost:8087/proseo/facility-mgr/v0.1
    archiveManager:
        url: http://localhost:8093/proseo/archive-mgr/v0.1
    orderGenerator:
        url: http://localhost:8094/proseo/order-gen/v0.1
        
    # Connection timeout in ms
    http.timeout: 10000
